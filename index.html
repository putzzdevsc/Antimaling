<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deteksi Objek Instan</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #0f0;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100vh;
  }
  #status {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 20px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 8px;
    z-index: 10;
    text-align: center;
    min-width: 90%;
    max-width: 95%;
  }
  .detected {
    background: #0a3d0a;
    color: #0f0;
    border: 2px solid #0f0;
    box-shadow: 0 0 20px #0f0;
  }
  .not-detected {
    background: #3d0a0a;
    color: #f00;
    border: 2px solid #f00;
    box-shadow: 0 0 30px #f00;
    animation: blink 0.4s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  video {
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    transform: scaleX(-1);
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    transform: scaleX(-1);
    pointer-events: none;
    z-index: 4;
  }
  #controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 10;
  }
  button {
    padding: 14px 28px;
    font-size: 16px;
    font-family: inherit;
    background: #111;
    color: #0f0;
    border: 2px solid #0f0;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  button:active { background: #0f0; color: #000; }
  button.off { color: #f00; border-color: #f00; }
  #flash-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
  }
  #flash-overlay.active { animation: flashAnim 0.25s infinite; }
  @keyframes flashAnim {
    0%, 100% { opacity: 0; }
    50% { opacity: 0.9; }
  }
  #sensitivity {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    color: #0f0;
    font-size: 12px;
    text-align: center;
    background: rgba(0,0,0,0.6);
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid #0f0;
  }
  input[type=range] { width: 200px; accent-color: #0f0; }
</style>
</head>
<body>

<div id="status" class="not-detected">TEKAN MULAI</div>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="flash-overlay"></div>

<div id="sensitivity">
  Sensitivitas: <span id="sens-val">15</span><br>
  <input type="range" id="sens" min="5" max="60" value="15">
</div>

<div id="controls">
  <button id="btn-start">▶ MULAI</button>
  <button id="btn-stop" class="off">■ STOP</button>
</div>

<script>
// ============================================
// KONFIGURASI
// ============================================
const CONFIG = {
  lostFramesThreshold: 12,   // frame hilang sebelum alarm (makin besar = makin toleran)
  alarmFrequency: 880,
  alarmVolume: 0.3,
  sampleW: 160,              // resolusi sampling (kecil = cepat)
  sampleH: 120
};

let motionThreshold = 15;    // ambang deteksi gerakan

// ============================================
// STATE
// ============================================
let video = document.getElementById('video');
let canvas = document.getElementById('canvas');
let ctx = canvas.getContext('2d');
let statusEl = document.getElementById('status');
let flashEl = document.getElementById('flash-overlay');
let audioCtx = null;
let alarmOsc = null;
let alarmGain = null;
let alarmInterval = null;
let flashTimer = null;
let isRunning = false;
let lostCounter = 0;
let prevFrame = null;
let baseline = null;
let baselineFrames = 0;
let motionLoop = null;

// canvas kecil untuk sampling
const sampleCanvas = document.createElement('canvas');
sampleCanvas.width = CONFIG.sampleW;
sampleCanvas.height = CONFIG.sampleH;
const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });

// ============================================
// SLIDER SENSITIVITAS
// ============================================
document.getElementById('sens').addEventListener('input', (e) => {
  motionThreshold = 65 - parseInt(e.target.value); // dibalik: slider kanan = lebih sensitif
  document.getElementById('sens-val').textContent = e.target.value;
});
// init: nilai 15 → threshold 50
motionThreshold = 65 - 15;

// ============================================
// KAMERA
// ============================================
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: 640, height: 480 }
    });
    video.srcObject = stream;
    await video.play();
    return true;
  } catch (e) {
    statusEl.textContent = 'AKSES KAMERA DITOLAK';
    statusEl.className = 'not-detected';
    return false;
  }
}

// ============================================
// AUDIO ALARM
// ============================================
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function startAlarm() {
  if (alarmOsc) return;
  initAudio();
  alarmOsc = audioCtx.createOscillator();
  alarmGain = audioCtx.createGain();
  alarmOsc.type = 'square';
  alarmOsc.frequency.value = CONFIG.alarmFrequency;
  alarmGain.gain.value = CONFIG.alarmVolume;
  alarmOsc.connect(alarmGain);
  alarmGain.connect(audioCtx.destination);
  alarmOsc.start();
  let t = 0;
  alarmInterval = setInterval(() => {
    if (!alarmOsc) return;
    t++;
    alarmOsc.frequency.setValueAtTime(
      t % 2 === 0 ? CONFIG.alarmFrequency : CONFIG.alarmFrequency * 0.6,
      audioCtx.currentTime
    );
  }, 200);
}

function stopAlarm() {
  if (alarmInterval) { clearInterval(alarmInterval); alarmInterval = null; }
  if (alarmOsc) {
    try { alarmOsc.stop(); } catch(e) {}
    alarmOsc.disconnect();
    alarmOsc = null;
    alarmGain = null;
  }
}

// ============================================
// FLASH
// ============================================
function startFlash() {
  if (flashTimer) return;
  flashEl.classList.add('active');
}

function stopFlash() {
  flashEl.classList.remove('active');
  flashEl.style.opacity = '0';
}

// ============================================
// DETEKSI GERAKAN + PERUBAHAN WARNA
// ============================================
function detectLoop() {
  if (!isRunning) return;

  // Ambil frame kecil
  sampleCtx.drawImage(video, 0, 0, CONFIG.sampleW, CONFIG.sampleH);
  const curr = sampleCtx.getImageData(0, 0, CONFIG.sampleW, CONFIG.sampleH).data;

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let hasObject = false;
  let totalDiff = 0;

  if (prevFrame) {
    // Hitung perbedaan piksel
    let diffPixels = 0;
    const totalPixels = curr.length / 4;
    let minX = CONFIG.sampleW, minY = CONFIG.sampleH;
    let maxX = 0, maxY = 0;

    for (let i = 0; i < curr.length; i += 4) {
      const dr = Math.abs(curr[i] - prevFrame[i]);
      const dg = Math.abs(curr[i+1] - prevFrame[i+1]);
      const db = Math.abs(curr[i+2] - prevFrame[i+2]);
      const diff = (dr + dg + db) / 3;
      totalDiff += diff;

      if (diff > motionThreshold) {
        diffPixels++;
        const px = (i / 4) % CONFIG.sampleW;
        const py = Math.floor((i / 4) / CONFIG.sampleW);
        if (px < minX) minX = px;
        if (py < minY) minY = py;
        if (px > maxX) maxX = px;
        if (py > maxY) maxY = py;
      }
    }

    const diffRatio = diffPixels / totalPixels;
    hasObject = diffRatio > 0.02; // minimal 2% piksel berubah

    // Gambar box di sekitar area yang berubah
    if (hasObject && maxX > minX && maxY > minY) {
      const scaleX = canvas.width / CONFIG.sampleW;
      const scaleY = canvas.height / CONFIG.sampleH;
      const x = minX * scaleX;
      const y = minY * scaleY;
      const w = (maxX - minX) * scaleX;
      const h = (maxY - minY) * scaleY;

      ctx.strokeStyle = '#0f0';
      ctx.lineWidth = 3;
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = '#0f0';
      ctx.font = 'bold 16px Courier New';
      ctx.fillText('OBJEK', x + 4, y - 6);
      ctx.beginPath();
      ctx.arc(x + w/2, y + h/2, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  prevFrame = curr;

  // Update status
  if (hasObject) {
    lostCounter = 0;
    stopAlarm();
    stopFlash();
    statusEl.className = 'detected';
    statusEl.textContent = '✔ OBJEK TERDETEKSI DI DEPAN KAMERA';
  } else {
    lostCounter++;
    if (lostCounter >= CONFIG.lostFramesThreshold) {
      statusEl.className = 'not-detected';
      statusEl.textContent = '⚠ TIDAK ADA OBJEK DI DEPAN KAMERA!';
      startAlarm();
      startFlash();
    } else {
      statusEl.className = 'not-detected';
      statusEl.textContent = `Menunggu objek... (${lostCounter}/${CONFIG.lostFramesThreshold})`;
    }
  }

  motionLoop = requestAnimationFrame(detectLoop);
}

// ============================================
// KONTROL
// ============================================
document.getElementById('btn-start').addEventListener('click', async () => {
  if (isRunning) return;
  initAudio();
  const ok = await startCamera();
  if (!ok) return;
  isRunning = true;
  lostCounter = 0;
  prevFrame = null;
  statusEl.className = 'detected';
  statusEl.textContent = 'MENDETEKSI...';
  detectLoop();
});

document.getElementById('btn-stop').addEventListener('click', () => {
  isRunning = false;
  if (motionLoop) cancelAnimationFrame(motionLoop);
  stopAlarm();
  stopFlash();
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  prevFrame = null;
  statusEl.textContent = 'DIHENTIKAN';
  statusEl.className = 'not-detected';
});

// Cegah layar mati saat deteksi
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch(e) {}
}
document.getElementById('btn-start').addEventListener('click', requestWakeLock);
</script>
</body>
</html>
