<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deteksi Objek + Alarm</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #0f0;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #status {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 24px;
    font-size: 20px;
    font-weight: bold;
    border-radius: 8px;
    z-index: 10;
    text-align: center;
    min-width: 280px;
  }
  .detected {
    background: #0a3d0a;
    color: #0f0;
    border: 2px solid #0f0;
    box-shadow: 0 0 20px #0f0;
  }
  .not-detected {
    background: #3d0a0a;
    color: #f00;
    border: 2px solid #f00;
    box-shadow: 0 0 30px #f00;
    animation: blink 0.4s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  #video-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1);
    pointer-events: none;
  }
  #controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 10;
  }
  button {
    padding: 12px 24px;
    font-size: 16px;
    font-family: inherit;
    background: #111;
    color: #0f0;
    border: 2px solid #0f0;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover { background: #0f0; color: #000; }
  button.off { color: #f00; border-color: #f00; }
  #flash-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    transition: opacity 0.05s;
  }
  #flash-overlay.active {
    animation: flashAnim 0.3s infinite;
  }
  @keyframes flashAnim {
    0%, 100% { opacity: 0; }
    50% { opacity: 0.8; }
  }
  #info {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #888;
    z-index: 10;
  }
</style>
</head>
<body>

<div id="status" class="not-detected">MENUNGGU KAMERA...</div>
<div id="video-container">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>
<div id="flash-overlay"></div>
<div id="controls">
  <button id="btn-start">▶ MULAI</button>
  <button id="btn-stop" class="off">■ STOP</button>
</div>
<div id="info">Arahkan kamera ke objek. Jika objek hilang → ALARM + FLASH</div>

<script>
// ============================================
// KONFIGURASI
// ============================================
const CONFIG = {
  detectionThreshold: 0.65,   // Sensitivitas deteksi (0-1)
  lostFramesThreshold: 5,     // Berapa frame objek hilang sebelum alarm
  alarmFrequency: 880,        // Hz alarm
  alarmVolume: 0.3,           // 0-1
  flashInterval: 300,         // ms interval flash
  modelUrl: 'https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js',
  tfUrl: 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js'
};

// ============================================
// STATE
// ============================================
let model = null;
let video = document.getElementById('video');
let canvas = document.getElementById('canvas');
let ctx = canvas.getContext('2d');
let statusEl = document.getElementById('status');
let flashEl = document.getElementById('flash-overlay');
let audioCtx = null;
let alarmOsc = null;
let alarmGain = null;
let flashTimer = null;
let isRunning = false;
let lostCounter = 0;
let detectionLoop = null;

// ============================================
// LOAD TENSORFLOW + COCO-SSD
// ============================================
function loadScript(url) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function initModel() {
  statusEl.textContent = 'MEMUAT MODEL AI...';
  statusEl.className = 'not-detected';
  await loadScript(CONFIG.tfUrl);
  await loadScript(CONFIG.modelUrl);
  model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
  statusEl.textContent = 'MODEL SIAP - TEKAN MULAI';
  statusEl.className = 'detected';
}

// ============================================
// KAMERA
// ============================================
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: 640, height: 480 }
    });
    video.srcObject = stream;
    await video.play();
    return true;
  } catch (e) {
    statusEl.textContent = 'AKSES KAMERA DITOLAK';
    statusEl.className = 'not-detected';
    return false;
  }
}

// ============================================
// ALARM SUARA
// ============================================
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function startAlarm() {
  if (alarmOsc) return;
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  alarmOsc = audioCtx.createOscillator();
  alarmGain = audioCtx.createGain();
  alarmOsc.type = 'square';
  alarmOsc.frequency.value = CONFIG.alarmFrequency;
  alarmGain.gain.value = CONFIG.alarmVolume;
  alarmOsc.connect(alarmGain);
  alarmGain.connect(audioCtx.destination);
  alarmOsc.start();
  // Modulasi suara alarm
  let t = 0;
  alarmOsc.frequency.setValueAtTime(CONFIG.alarmFrequency, audioCtx.currentTime);
  const interval = setInterval(() => {
    if (!alarmOsc) { clearInterval(interval); return; }
    t++;
    alarmOsc.frequency.setValueAtTime(
      t % 2 === 0 ? CONFIG.alarmFrequency : CONFIG.alarmFrequency * 0.6,
      audioCtx.currentTime
    );
  }, 200);
}

function stopAlarm() {
  if (alarmOsc) {
    try { alarmOsc.stop(); } catch(e) {}
    alarmOsc.disconnect();
    alarmOsc = null;
    alarmGain = null;
  }
}

// ============================================
// FLASH KAMERA (layar putih berkedip)
// ============================================
function startFlash() {
  if (flashTimer) return;
  flashEl.classList.add('active');
  flashTimer = setInterval(() => {
    flashEl.classList.toggle('active');
  }, CONFIG.flashInterval);
}

function stopFlash() {
  if (flashTimer) {
    clearInterval(flashTimer);
    flashTimer = null;
  }
  flashEl.classList.remove('active');
  flashEl.style.opacity = '0';
}

// ============================================
// LOOP DETEKSI
// ============================================
async function detectLoop() {
  if (!isRunning || !model) return;

  try {
    const predictions = await model.detect(video);
    const filtered = predictions.filter(p => p.score >= CONFIG.detectionThreshold);

    // Resize canvas
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (filtered.length > 0) {
      // OBJEK TERDETEKSI
      lostCounter = 0;
      stopAlarm();
      stopFlash();
      statusEl.className = 'detected';
      const labels = filtered.map(p => `${p.class} (${Math.round(p.score*100)}%)`).join(', ');
      statusEl.textContent = `✔ TERDETEKSI: ${labels}`;

      // Gambar bounding box
      filtered.forEach(p => {
        const [x, y, w, h] = p.bbox;
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, w, h);
        ctx.fillStyle = '#0f0';
        ctx.font = 'bold 16px Courier New';
        ctx.fillText(`${p.class} ${Math.round(p.score*100)}%`, x + 4, y - 6);
        // Titik tengah
        ctx.beginPath();
        ctx.arc(x + w/2, y + h/2, 5, 0, Math.PI*2);
        ctx.fillStyle = '#0f0';
        ctx.fill();
      });
    } else {
      // TIDAK ADA OBJEK
      lostCounter++;
      if (lostCounter >= CONFIG.lostFramesThreshold) {
        statusEl.className = 'not-detected';
        statusEl.textContent = '⚠ TIDAK ADA OBJEK DI DEPAN KAMERA!';
        startAlarm();
        startFlash();
      } else {
        statusEl.className = 'not-detected';
        statusEl.textContent = `Menunggu objek... (${lostCounter}/${CONFIG.lostFramesThreshold})`;
      }
    }
  } catch(e) {
    console.error(e);
  }

  detectionLoop = requestAnimationFrame(detectLoop);
}

// ============================================
// KONTROL
// ============================================
document.getElementById('btn-start').addEventListener('click', async () => {
  if (isRunning) return;
  initAudio();
  const ok = await startCamera();
  if (!ok) return;
  isRunning = true;
  lostCounter = 0;
  statusEl.textContent = 'MENDETEKSI...';
  statusEl.className = 'detected';
  detectLoop();
});

document.getElementById('btn-stop').addEventListener('click', () => {
  isRunning = false;
  if (detectionLoop) cancelAnimationFrame(detectionLoop);
  stopAlarm();
  stopFlash();
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  statusEl.textContent = 'DIHENTIKAN';
  statusEl.className = 'not-detected';
});

// ============================================
// INIT
// ============================================
initModel();
</script>
</body>
</html>
